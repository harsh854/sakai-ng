<div class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-100 p-4 md:p-8">
  <div class="max-w-4xl mx-auto">
    <!-- Header Section -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl shadow-lg mb-4">
        <i class="pi pi-video text-2xl text-white"></i>
      </div>
      <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2">Camera Configuration</h1>
      <p class="text-gray-600 text-lg">Configure your camera settings with precision and ease</p>
    </div>

    <!-- Main Card -->
    <div class="bg-white/80 backdrop-blur-sm rounded-3xl shadow-2xl border border-white/20 overflow-hidden">
      <!-- Card Header -->
      <div class="bg-gradient-to-r from-blue-600 to-indigo-600 px-8 py-6">
        <div class="flex items-center gap-3">
          <i class="pi pi-cog text-white text-xl"></i>
          <h2 class="text-xl font-semibold text-white">Device Settings</h2>
        </div>
      </div>

      <!-- Form Content -->
      <div class="p-8">
        <form [formGroup]="cameraForm" (ngSubmit)="onSubmit()" class="space-y-8">
          <!-- Input Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div *ngFor="let field of fields" class="group">
              <div class="relative">
                <label 
                  [for]="field.id" 
                  class="block text-sm font-semibold text-gray-700 mb-2 transition-colors group-focus-within:text-blue-600"
                >
                  {{ field.label }}
                  <span class="text-red-500 ml-1">*</span>
                </label>
                
                <div class="relative">
                  <input
                    pInputText
                    [id]="field.id"
                    [type]="field.type"
                    [placeholder]="field.placeholder"
                    class="w-full h-12 px-4 text-gray-900 bg-gray-50 border-2 border-gray-200 rounded-xl 
                           transition-all duration-200 ease-in-out
                           focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-100 focus:outline-none
                           hover:border-gray-300 hover:bg-white
                           placeholder:text-gray-400"
                    [formControlName]="field.controlName"
                    [class.border-red-300]="submitted && f[field.controlName].errors"
                    [class.bg-red-50]="submitted && f[field.controlName].errors"
                  />
                  
                  <!-- Success Icon -->
                  <div *ngIf="!f[field.controlName].errors && f[field.controlName].value" 
                       class="absolute right-3 top-1/2 transform -translate-y-1/2">
                    <i class="pi pi-check-circle text-green-500"></i>
                  </div>
                  
                  <!-- Error Icon -->
                  <div *ngIf="submitted && f[field.controlName].errors" 
                       class="absolute right-3 top-1/2 transform -translate-y-1/2">
                    <i class="pi pi-exclamation-circle text-red-500"></i>
                  </div>
                </div>
                
                <!-- Error Message -->
                <div *ngIf="submitted && f[field.controlName].errors" 
                     class="mt-2 flex items-center gap-2 text-sm text-red-600 animate-fade-in">
                  <i class="pi pi-times-circle text-xs"></i>
                  <span>{{ field.label }} is required</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Divider -->
          <div class="border-t border-gray-200 my-8"></div>
          
          <!-- Action Buttons -->
          <div class="flex flex-col sm:flex-row justify-end gap-4">
            <!-- Reset Button -->
            <button
              type="button"
              pButton
              class="group relative px-8 py-3 bg-white text-gray-700 font-semibold rounded-xl 
                     border-2 border-gray-200 shadow-sm
                     hover:border-gray-300 hover:bg-gray-50 hover:shadow-md
                     focus:ring-4 focus:ring-gray-100 focus:outline-none
                     transition-all duration-200 ease-in-out
                     active:scale-95"
              (click)="onReset()"
            >
              <div class="flex items-center justify-center gap-3">
                <i class="pi pi-refresh text-lg transition-transform group-hover:rotate-180 duration-300"></i>
                <span>Reset Form</span>
              </div>
            </button>

            <!-- Save Button -->
            <button
              type="submit"
              pButton
              class="group relative px-8 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 
                     text-white font-semibold rounded-xl shadow-lg
                     hover:from-blue-700 hover:to-indigo-700 hover:shadow-xl hover:-translate-y-0.5
                     focus:ring-4 focus:ring-blue-200 focus:outline-none
                     transition-all duration-200 ease-in-out
                     active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
              [disabled]="cameraForm.invalid"
            >
              <div class="flex items-center justify-center gap-3">
                <i class="pi pi-save text-lg group-hover:scale-110 transition-transform duration-200"></i>
                <span>Save Configuration</span>
              </div>
              
              <!-- Loading Spinner (if needed) -->
              <div *ngIf="isLoading" class="absolute inset-0 flex items-center justify-center bg-blue-600 rounded-xl">
                <i class="pi pi-spin pi-spinner text-white"></i>
              </div>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Additional Info Card -->
    <div class="mt-6 bg-white/60 backdrop-blur-sm rounded-2xl p-6 border border-white/20">
      <div class="flex items-start gap-4">
        <div class="flex-shrink-0 w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
          <i class="pi pi-info-circle text-blue-600"></i>
        </div>
        <div>
          <h3 class="font-semibold text-gray-900 mb-1">Configuration Tips</h3>
          <p class="text-gray-600 text-sm leading-relaxed">
            Ensure all camera parameters are correctly configured before saving. 
            Invalid configurations may result in connection issues or poor video quality.
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notifications -->
  <p-toast position="top-right" styleClass="custom-toast"></p-toast>
</div>
